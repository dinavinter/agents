applications:
  -   name: yjs-test
      command: yarn run start
      health-check-type: none
      stack: cflinuxfs4
      memory: 512M
      instances: 1
      disk_quota: 2GB
      routes:
        - route: yjs-test.cfapps.us10-001.hana.ondemand.com
      env:
        NODE_OPTIONS: --max-http-header-size=80000
        NODE_ENV: production
        UAA_SERVICE: fastify-uaa-service
        LOG_SENSITIVE_CONNECTION_DATA: true
        LOG_REMOTE_USER: true
        LOG_REFERER: true
        DATABASE: hp.sqlite
        
      buildpacks:
        - https://github.com/cloudfoundry/nodejs-buildpack
 
