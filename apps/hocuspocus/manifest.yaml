applications:
  -   name: yjs
      command: yarn run start
      health-check-type: none
      stack: cflinuxfs4
      memory: 2GB
      instances: 1
      disk_quota: 4GB
      routes:
        - route: https://yjs.cfapps.us10-001.hana.ondemand.com
      env:
        NODE_OPTIONS: --max-http-header-size=80000
        NODE_ENV: production
        UAA_SERVICE: fastify-uaa-service
        LOG_SENSITIVE_CONNECTION_DATA: true
        LOG_REMOTE_USER: true
        LOG_REFERER: true
        DATABASE: /var/yjs/store.sqlite
        
      buildpacks:
        - https://github.com/cloudfoundry/nodejs-buildpack
      services:
         - log
         - name: flit
           parameters:
             - readonly: false
               mount: "/var/yjs"
 
  
  
  
