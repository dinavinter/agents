apiVersion: serverless.kyma-project.io/v1alpha2
kind: Function
metadata:
  name: agent-viewer
  namespace: agents
  labels:
    app: agent-viewer
spec:
  replicas: 1
  runtime: nodejs22
  source:
    inline:
      dependencies: |
        {
          "name": "agent-viewer",
          "version": "1.0.0",
          "dependencies": {
            "@hocuspocus/provider": "^4.0.0",
            "yjs": "^13.6.23"
          }
        }
      source: |
        const Y = require('yjs');
        const { HocuspocusProvider } = require('@hocuspocus/provider');

        const YJS_URL = process.env.YJS_URL || 'ws://hocuspocus.agents.svc.cluster.local:1234';
        const providers = new Map();

        function getDoc(id) {
          if (!providers.has(id)) {
            const doc = new Y.Doc({ guid: id });
            const provider = new HocuspocusProvider({ url: YJS_URL, name: id, document: doc });
            providers.set(id, { doc, provider });
          }
          return providers.get(id);
        }

        module.exports = {
          main: async function(event, context) {
            const req = event.extensions.request;
            const res = event.extensions.response;
            const path = req.path;
            const method = req.method;

            // GET / — list available agents
            if (path === '/' || path === '') {
              const { doc: agentsDoc } = getDoc(':agents');
              await new Promise(r => setTimeout(r, 1000));
              const agents = {};
              agentsDoc.share.forEach((value, key) => {
                if (key) agents[key] = agentsDoc.getMap(key).toJSON();
              });
              return agents;
            }

            // GET /ide/:agent — CodeMirror editor for agent source code
            const ideMatch = path.match(/^\/ide\/([^/]+)$/);
            if (ideMatch && method === 'GET') {
              const [, agent] = ideMatch;
              let src = '';
              // Fetch source directly from GitHub
              const repo = 'dinavinter/agents';
              const branch = 'restruct';
              const filePath = `apps/serverless-runner/examples/agent-${agent}/handler.mjs`;
              try {
                const ghResp = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/${filePath}?t=${Date.now()}`);
                if (ghResp.ok) src = await ghResp.text();
              } catch(e) {}
              if (!src) src = `// agent: ${agent}\nimport { assign, setup, emit, createMachine } from "https://esm.sh/xstate@5.19.0";\n\nexport const machine = createMachine({\n  id: "${agent}",\n  initial: "idle",\n  states: {\n    idle: {}\n  }\n});\n`;

              res.writeHead(200, { 'Content-Type': 'text/html' });
              res.end(`<!DOCTYPE html>
        <html>
        <head>
          <title>IDE: ${agent}</title>
          <script src="https://cdn.tailwindcss.com"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/dracula.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
        </head>
        <body class="bg-gray-900 text-white min-h-screen flex flex-col">
          <div class="flex items-center justify-between p-3 bg-gray-800 border-b border-gray-700">
            <div class="flex items-center gap-3">
              <span class="text-lg font-bold">Agent: ${agent}</span>
              <span id="status" class="text-sm text-gray-400">ready</span>
            </div>
            <div class="flex gap-2">
              <button onclick="deploy()" class="px-4 py-1.5 bg-green-600 hover:bg-green-500 rounded text-sm font-medium">
                Deploy & Run
              </button>
              <a href="/page/${agent}" target="_blank" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium">
                View
              </a>
            </div>
          </div>
          <div class="flex-1" id="editor-wrapper">
            <textarea id="code">${src.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
          </div>
          <script>
            const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
              mode: 'javascript',
              theme: 'dracula',
              lineNumbers: true,
              tabSize: 2,
              indentWithTabs: false,
              lineWrapping: true,
            });
            editor.setSize('100%', '100%');
            document.getElementById('editor-wrapper').style.height = 'calc(100vh - 52px)';
            editor.getWrapperElement().style.height = '100%';

            async function deploy() {
              const status = document.getElementById('status');
              const code = editor.getValue();
              status.textContent = 'deploying...';
              status.className = 'text-sm text-yellow-400';
              try {
                const resp = await fetch('/deploy/${agent}', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ code }),
                });
                const result = await resp.json();
                if (result.status === 'deployed') {
                  status.textContent = 'deployed ✓ rev: ' + (result.rev || '');
                  status.className = 'text-sm text-green-400';
                } else {
                  status.textContent = 'error: ' + (result.error || 'unknown');
                  status.className = 'text-sm text-red-400';
                }
              } catch(e) {
                status.textContent = 'error: ' + e.message;
                status.className = 'text-sm text-red-400';
              }
            }

            // Ctrl+S / Cmd+S to deploy
            document.addEventListener('keydown', (e) => {
              if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                deploy();
              }
            });
          </script>
        </body>
        </html>`);
              return;
            }

            // POST /deploy/:agent — save code to GitHub and reload function
            const deployMatch = path.match(/^\/deploy\/([^/]+)$/);
            if (deployMatch && method === 'POST') {
              const [, agent] = deployMatch;
              const { code } = event.data;
              if (!code) return { error: 'no code provided' };

              const ghToken = process.env.GITHUB_TOKEN;
              const repo = 'dinavinter/agents';
              const filePath = `apps/serverless-runner/examples/agent-${agent}/handler.mjs`;
              const branch = 'restruct';

              try {
                // Get current file SHA (needed for update)
                const getResp = await fetch(
                  `https://api.github.com/repos/${repo}/contents/${filePath}?ref=${branch}`,
                  { headers: { Authorization: `token ${ghToken}`, 'User-Agent': 'kyma-agent-ide' } }
                );
                const fileData = getResp.ok ? await getResp.json() : null;
                const sha = fileData?.sha;

                // Commit new code
                const putResp = await fetch(
                  `https://api.github.com/repos/${repo}/contents/${filePath}`,
                  {
                    method: 'PUT',
                    headers: { Authorization: `token ${ghToken}`, 'User-Agent': 'kyma-agent-ide', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      message: `update agent ${agent} from IDE`,
                      content: Buffer.from(code).toString('base64'),
                      branch,
                      ...(sha ? { sha } : {}),
                    }),
                  }
                );

                if (!putResp.ok) {
                  const err = await putResp.text();
                  return { error: `GitHub: ${putResp.status} ${err}` };
                }

                // Reload the function
                const fnUrl = `https://agent-runner-${agent}-agents.c-127c9ef.stage.kyma.ondemand.com`;
                const reloadResp = await fetch(`${fnUrl}/_reload`, { method: 'POST' });
                const reloadResult = await reloadResp.json();

                return { status: 'deployed', rev: reloadResult.rev, github: 'committed' };
              } catch(e) {
                return { error: e.message };
              }
            }

            // GET /view/:agent/:rev — SSE stream of emitted events
            const viewMatch = path.match(/^\/view\/([^/]+)\/([^/]+)/);
            if (viewMatch && req.headers.accept?.includes('text/event-stream')) {
              const [, agent, rev] = viewMatch;
              const id = `${agent}:${rev}`;
              const { doc, provider } = getDoc(id);

              // Wait for sync
              await new Promise((resolve) => {
                if (provider.isSynced) return resolve();
                provider.on('synced', () => resolve());
                setTimeout(resolve, 5000);
              });

              // SSE response
              res.writeHead(200, {
                'Content-Type': 'text/event-stream',
                'Cache-Control': 'no-cache',
                'Connection': 'keep-alive',
                'Access-Control-Allow-Origin': '*',
              });
              res.write('retry: 3000\n\n');

              // Send only the LAST emitted event (current state, not full history)
              const emitted = doc.getArray('emitted');
              function formatSSE(ev) {
                const lines = ev.data.split('\n').map(l => 'data: ' + l).join('\n');
                return `event: ${ev.type || 'message'}\n${lines}\n\n`;
              }
              if (emitted.length > 0) {
                const last = emitted.get(emitted.length - 1);
                if (last && last.data) {
                  res.write(formatSSE(last));
                }
              }

              // Watch for new events
              const observer = (event) => {
                event.changes.added.forEach(item => {
                  item.content.getContent().forEach(ev => {
                    if (ev && ev.data) {
                      res.write(formatSSE(ev));
                    }
                  });
                });
              };
              emitted.observe(observer);

              // Keep connection alive
              const keepalive = setInterval(() => res.write(':\n\n'), 15000);
              req.on('close', () => { emitted.unobserve(observer); clearInterval(keepalive); });
              return; // Don't end response
            }

            // GET /page/:agent — auto-resolve latest rev from agent doc
            const pageAutoMatch = path.match(/^\/page\/([^/]+)$/);
            if (pageAutoMatch) {
              const [, agent] = pageAutoMatch;
              const { doc: agentDoc, provider: agentProv } = getDoc(agent);
              await new Promise(r => { if (agentProv.isSynced) return r(); agentProv.on('synced', r); setTimeout(r, 3000); });
              const rev = agentDoc.getMap().get('rev') || 'live';
              res.writeHead(302, { 'Location': `/page/${agent}/${rev}` });
              res.end();
              return;
            }

            // GET /page/:agent/:rev — HTML page with HTMX polling
            const pageMatch = path.match(/^\/page\/([^/]+)\/([^/]+)/);
            if (pageMatch) {
              const [, agent, rev] = pageMatch;
              res.writeHead(200, { 'Content-Type': 'text/html', 'Access-Control-Allow-Origin': '*' });
              res.end(`<!DOCTYPE html>
        <html>
        <head>
          <title>Agent: ${agent}</title>
          <script src="https://unpkg.com/htmx.org@2.0.2"></script>
          <script src="https://cdn.tailwindcss.com"></script>
        </head>
        <body class="bg-gray-50 min-h-screen p-4">
          <div class="max-w-2xl mx-auto">
            <div class="mb-4 text-sm text-gray-500">
              Agent: <b>${agent}</b> | Rev: <code>${rev}</code> | 
              <span class="text-green-500">● Live</span>
            </div>
            <div hx-get="/latest/${agent}/${rev}" hx-trigger="load, every 1s" hx-swap="innerHTML transition:true">
              <div class="text-center text-gray-400 p-8">Loading...</div>
            </div>
          </div>
        </body>
        </html>`);
              return;
            }

            // GET /latest/:agent/:rev — returns the latest emitted HTML fragment
            const latestMatch = path.match(/^\/latest\/([^/]+)\/([^/]+)/);
            if (latestMatch) {
              const [, agent, rev] = latestMatch;
              const id = `${agent}:${rev}`;
              const { doc, provider } = getDoc(id);
              await new Promise(r => { if (provider.isSynced) return r(); provider.on('synced', r); setTimeout(r, 3000); });
              const emitted = doc.getArray('emitted');
              if (emitted.length > 0) {
                const last = emitted.get(emitted.length - 1);
                if (last && last.data) {
                  res.writeHead(200, { 'Content-Type': 'text/html', 'Access-Control-Allow-Origin': '*' });
                  res.end(last.data);
                  return;
                }
              }
              res.writeHead(200, { 'Content-Type': 'text/html', 'Access-Control-Allow-Origin': '*' });
              res.end('<div class="text-center text-gray-400 p-8">Waiting for agent output...</div>');
              return;
            }

            // POST /play/:agent/:index — proxy move to the agent function (same-origin)
            const playMatch = path.match(/^\/play\/([^/]+)\/(\d+)/);
            if (playMatch && method === 'POST') {
              const [, agent, index] = playMatch;
              const fnUrl = `https://agent-runner-${agent}-agents.c-127c9ef.stage.kyma.ondemand.com/`;
              const resp = await fetch(fnUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'PLAY', index: parseInt(index) }),
              });
              const result = await resp.json();
              return result;
            }

            // POST /**/events/:event — proxy form submissions to the agent function
            // Handles relative hx-post="events/request" from agent-rendered HTML
            const eventsProxyMatch = path.match(/\/(?:page\/)?([^/]+)(?:\/[^/]+)?\/events\/(.+)/);
            if (eventsProxyMatch && method === 'POST') {
              const [, agent, eventType] = eventsProxyMatch;
              const fnUrl = `https://agent-runner-${agent}-agents.c-127c9ef.stage.kyma.ondemand.com/`;
              // Forward the form data as an event
              const body = event.data || {};
              const payload = typeof body === 'string' ? { type: eventType, [eventType]: body } : { type: eventType, ...body };
              const resp = await fetch(fnUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              const result = await resp.json();
              // Return HTML snippet so hx-swap works
              res.writeHead(200, { 'Content-Type': 'text/html' });
              res.end(`<span class="text-green-500">✓ ${result.state || 'sent'}</span>`);
              return;
            }

            // POST /events/:agent/:rev — push an event to the agent's emitted array
            const eventsMatch = path.match(/^\/events\/([^/]+)\/([^/]+)/);
            if (eventsMatch && method === 'POST') {
              const [, agent, rev] = eventsMatch;
              const id = `${agent}:${rev}`;
              const { doc } = getDoc(id);
              const data = event.data;
              doc.getArray('emitted').push([{
                type: data.type || 'message',
                data: data.data || JSON.stringify(data),
                timestamp: Date.now(),
                offset: 0,
                defer: 10,
              }]);
              return { status: 'pushed' };
            }

            return { endpoints: ['GET /', 'GET /page/:agent/:rev', 'GET /view/:agent/:rev (SSE)', 'POST /events/:agent/:rev'] };
          }
        };
  env:
    - name: YJS_URL
      value: "ws://hocuspocus.agents.svc.cluster.local:1234"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: github-token
          key: token
          optional: true
  resourceConfiguration:
    function:
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
        requests:
          cpu: "50m"
          memory: "128Mi"
