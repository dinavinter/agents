applications: 
  - name: yjs-websocket
    command: npm run start 
    health-check-type: none
    stack: cflinuxfs4
    memory: 5GB
    instances: 1
    disk_quota: 1GB
    routes:
      - route: https://yjs-ws.cfapps.us10-001.hana.ondemand.com
    env:
      NODE_OPTIONS: --max-http-header-size=80000
      NODE_ENV: production
      LOG_SENSITIVE_CONNECTION_DATA: true
      LOG_REMOTE_USER: true
      LOG_REFERER: true
    services:
      - log
    buildpacks:
      - https://github.com/cloudfoundry/nodejs-buildpack


  
