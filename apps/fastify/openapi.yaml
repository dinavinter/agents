  /agents/{agent}/start:
    post:
      summary: Start Agent
      description: >+
        This route is to create an agent definition

        ```javascript title="source"

        async handler (request, reply) {
          const {
            agent: id
          } = request.params;
          const agent = fastify["agent.fromDoc"](fastify.docs.getOrCreate(id));
          console.log(`Starting agent ${id} ${agent.getMap().get("rev")}  ${agent.getMap().get("src")}`);
          const {
            href
          } = await fastify.vm(agent.createSnapshot()).start();
          console.log(`Listening at ${href}.`);
          reply.type("application/json");
          return reply.send(JSON.stringify({
            id,
            links: {
              self: request.originalUrl,
              worker: href
            }
          }));
        }

        ```

      parameters:
        - schema:
            type: string
          example: emit
          in: path
          name: agent
          required: true
      x-source: >+
        
