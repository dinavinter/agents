  /sse:
    get:
      summary: Proxy Server Sent Events
      description: >+
        This route will proxy server sent events from another server to the
        client

        ```javascript title="source"

        async handler (request, reply) {
          const {
            url,
            type
          } = request.query;
          reply.type("text/html");
          return reply.send(
            `<html>
                            <head>
                                 <script src="https://unpkg.com/htmx.org@2.0.2"><\/script>
                                 <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"><\/script>
                                <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"><\/script>
                            </head>
                            <body>  
                                 <div hx-ext="sse" sse-connect="${url}" sse-close="done" hx-ext="sse" sse-swap="${type || "*"}" hx-swap="beforeend" class="h-screen w-screen"/>
                            </body>
                            </html> `
          );
        }

        ```

      parameters:
        - schema:
            - url
          in: query
          name: required
        - schema:
            url:
              type: string
              format: uri
              description: The url of the server sent events
            type:
              type: string
              description: The type event to swap
          in: query
          name: properties
      x-source: >+
        
        ```javascript title="source"

        async handler (request, reply) {
