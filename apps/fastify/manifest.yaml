applications:
  -   name: agents
      command: yarn run start
      
      routes:
        - route: 'https://agents.cfapps.us10-001.hana.ondemand.com'
      stack: cflinuxfs4
      memory: 512M
      instances: 3
      env:
        NODE_OPTIONS: --max-http-header-size=80000
        NODE_ENV: production
        UAA_SERVICE: fastify-uaa-service
        LOG_SENSITIVE_CONNECTION_DATA: true
        LOG_REMOTE_USER: true
        LOG_REFERER: true
        YJS_URL: 'https://yjs.cfapps.us10-001.hana.ondemand.com:'
        
      buildpacks:
        - https://github.com/cloudfoundry/nodejs-buildpack
      services:
        - fastify-uaa-service
        - log
